<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn English</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1 id="logo">Learn English</h1></header>
<main class="w">
  <!-- تبويبات الصفحة الرئيسية: المواضيع | القواعد | الأصوات -->
  <div id="htabs"></div>
  <div id="home"></div>
  <!-- القواعد والأصوات (دروس لكل مستوى) -->
  <div id="learn"></div>
  <!-- داخل الموضوع: المستويات + الأقسام -->
  <div id="view">
    <div class="top"><button class="k" id="back">→ المواضيع</button><h2 id="ttl"></h2></div>
    <!-- التحكم في سرعة النطق (بيأثر على كل أزرار 🎤 و🐢) -->
    <div class="spd">
      <span>🎧 السرعة</span>
      <button class="k" id="sm" aria-label="أبطأ">−</button>
      <b id="sv">0.9×</b>
      <button class="k" id="sp" aria-label="أسرع">+</button>
    </div>
    <nav id="lv"></nav>
    <div class="p" id="stat"></div>
    <div id="tabs"></div>
    <div id="main"></div>
  </div>
</main>
<!-- قائمة المواضيع (ملفات المحتوى بتتحمّل تلقائياً من فولدر data) -->
<script src="data/topics.js"></script>
<script src="script.js"></script>
</body>
</html>
